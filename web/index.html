<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barking-Agent | 机器狗自进化评测看板</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-primary: #f0f6fc;
        --text-secondary: #8b949e;
        --accent-color: #58a6ff;
        --success-color: #3fb950;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        padding: 40px 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 24px;
        margin-bottom: 32px;
      }
      h1 {
        font-size: 28px;
        color: var(--accent-color);
        margin-bottom: 8px;
      }
      p.subtitle {
        color: var(--text-secondary);
        font-size: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
      }
      .card-title {
        font-size: 13px;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .card-value {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .card-value.highlight {
        color: var(--success-color);
      }
      .main-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 24px;
        text-align: center;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Barking-Agent Dashboard</h1>
        <p class="subtitle">2026 国赛 B 题：机器狗无线电测向与多干扰源清剿自进化基准看板</p>
      </header>

      <section class="grid">
        <div class="card">
          <div class="card-title">全谱系清剿率 (Clearance)</div>
          <div class="card-value highlight">100.0%</div>
          <small style="color: var(--text-secondary);">30 种子全量 / 395 目标全歼</small>
        </div>
        <div class="card">
          <div class="card-title">单目标平均耗时 (Avg Time)</div>
          <div class="card-value">283.37s</div>
          <small style="color: var(--text-secondary);">基线初始收敛指标</small>
        </div>
        <div class="card">
          <div class="card-title">不确定度指数 (PUI)</div>
          <div class="card-value">0.580</div>
          <small style="color: var(--text-secondary);">路径与信息增益综合代价</small>
        </div>
        <div class="card">
          <div class="card-title">综合适应度评分 (Score)</div>
          <div class="card-value highlight">81.72</div>
          <small style="color: var(--text-secondary);">任务套件基线基准分</small>
        </div>
      </section>

      <div class="main-panel">
        <p>轻量化静态前端就绪。后续可直接在此单文件中扩展战场态势 Canvas 绘图与收敛曲线可视化。</p>
      </div>
    </div>
  </body>
</html>
