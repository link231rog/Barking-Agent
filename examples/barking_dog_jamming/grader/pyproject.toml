[project]
name = "barking-dog-grader"
version = "0.1.0"
description = "CORAL grader for Barking-Dog Jammer Neutralization & Active Localization (CUMCM 2026 Problem B)."
requires-python = ">=3.11"
dependencies = [
    "coral",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barking_dog_grader"]
